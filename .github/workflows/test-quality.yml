name: Test quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-unit-coverage:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: gerdoctor_ci
      JWT_SECRET: ci-test-secret-with-sufficient-entropy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: pytest -c pytest.next.ini
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage-unit.xml

  backend-domain-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - run: pip install -r requirements.txt -r requirements-test.txt
      - run: mypy
      - run: pytest -c pytest.domain.ini
      - run: mutmut run
      - run: mutmut export-cicd-stats
      - run: python scripts/assert_mutation_quality.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-domain-coverage
          path: backend/coverage-domain.xml

  frontend-unit-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run test:coverage -- --runInBand
      - run: npm run build

  frontend-mutation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-mutation-report
          path: frontend/reports/mutation/
