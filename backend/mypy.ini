[mypy]
python_version = 3.12
strict = True
show_error_codes = True
show_column_numbers = True
pretty = True
exclude = ^web/application\.py$
files =
    slices,
    web,
    shared/types.py,
    infrastructure/clock.py,
    infrastructure/identifiers.py,
    infrastructure/mongo_ids.py,
    infrastructure/mongo_serialization.py,
    infrastructure/mongo_bootstrap.py,
    infrastructure/smtp_email_gateway.py

warn_unreachable = True
no_implicit_reexport = True
