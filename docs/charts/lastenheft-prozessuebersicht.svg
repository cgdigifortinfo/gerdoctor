<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Prozessübersicht</title>
  <desc id="desc">Survey-Landingpage, Registrierung, Nutzer-Dashboard, Decision-Step, Upload- oder Partnerpfad, Meilenstein, nächste Etappe und Admin-Verwaltung.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#004856"/>
    </marker>
    <style>
      .box { fill: #f6fbfa; stroke: #004856; stroke-width: 3; rx: 14; }
      .decision { fill: #fff5f5; stroke: #ff6b6b; stroke-width: 3; }
      .admin { fill: #e6faf6; stroke: #004856; stroke-width: 3; rx: 14; }
      .line { stroke: #004856; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font-family: "DejaVu Sans", sans-serif; font-size: 26px; font-weight: 600; fill: #12343b; text-anchor: middle; }
      .small { font-family: "DejaVu Sans", sans-serif; font-size: 20px; font-weight: 500; fill: #345; text-anchor: middle; }
      .edge { font-family: "DejaVu Sans", sans-serif; font-size: 19px; font-weight: 500; fill: #004856; text-anchor: middle; }
      .title { font-family: "DejaVu Sans", sans-serif; font-size: 34px; font-weight: 700; fill: #004856; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="60" y="58" class="title">Prozessübersicht Lastenheft</text>

  <rect x="60" y="120" width="210" height="90" class="box"/>
  <text x="165" y="156" class="label">Landingpage</text>
  <text x="165" y="184" class="small">je Survey</text>

  <rect x="330" y="120" width="210" height="90" class="box"/>
  <text x="435" y="172" class="label">Registrierung</text>

  <rect x="600" y="120" width="240" height="90" class="box"/>
  <text x="720" y="156" class="label">Nutzer-</text>
  <text x="720" y="184" class="label">Dashboard</text>

  <polygon points="1010,105 1135,165 1010,225 885,165" class="decision"/>
  <text x="1010" y="157" class="label">Decision-</text>
  <text x="1010" y="185" class="label">Step</text>

  <rect x="760" y="330" width="230" height="90" class="box"/>
  <text x="875" y="366" class="label">Upload-</text>
  <text x="875" y="394" class="label">Step</text>

  <rect x="1030" y="330" width="230" height="90" class="box"/>
  <text x="1145" y="366" class="label">Partner-</text>
  <text x="1145" y="394" class="label">auswahl</text>

  <rect x="1030" y="505" width="230" height="90" class="box"/>
  <text x="1145" y="541" class="label">Partner-</text>
  <text x="1145" y="569" class="label">Dashboard</text>

  <rect x="760" y="505" width="230" height="90" class="box"/>
  <text x="875" y="558" class="label">Meilenstein</text>

  <rect x="470" y="505" width="230" height="90" class="box"/>
  <text x="585" y="541" class="label">Nächste</text>
  <text x="585" y="569" class="label">Etappe</text>

  <rect x="60" y="505" width="370" height="90" class="admin"/>
  <text x="245" y="537" class="label">Admin</text>
  <text x="245" y="565" class="small">Surveys, Steps, Nutzer</text>
  <text x="245" y="589" class="small">Partner, CMS, E-Mails</text>

  <path d="M270,165 L330,165" class="line"/>
  <path d="M540,165 L600,165" class="line"/>
  <path d="M840,165 L885,165" class="line"/>

  <path d="M963,210 C930,250 895,285 875,330" class="line"/>
  <text x="866" y="285" class="edge">Dokumente selbst hochladen</text>

  <path d="M1057,210 C1100,255 1130,290 1145,330" class="line"/>
  <text x="1175" y="285" class="edge">Partner nutzen</text>

  <path d="M875,420 L875,505" class="line"/>
  <path d="M1145,420 L1145,505" class="line"/>
  <path d="M1030,550 L990,550" class="line"/>
  <path d="M760,550 L700,550" class="line"/>

  <path d="M430,550 L470,550" class="line"/>
</svg>
