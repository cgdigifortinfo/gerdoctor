<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Systemarchitektur</title>
  <desc id="desc">React Frontend mit Admin-, Partner- und Nutzer-Dashboard greift auf FastAPI Backend zu. Das Backend nutzt MongoDB, Upload Storage und Mail Provider.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#004856"/>
    </marker>
    <style>
      .box { fill: #f6fbfa; stroke: #004856; stroke-width: 3; rx: 14; }
      .api { fill: #e6faf6; stroke: #004856; stroke-width: 4; rx: 18; }
      .store { fill: #fff5f5; stroke: #ff6b6b; stroke-width: 3; rx: 14; }
      .line { stroke: #004856; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font-family: "DejaVu Sans", sans-serif; font-size: 26px; font-weight: 600; fill: #12343b; text-anchor: middle; }
      .small { font-family: "DejaVu Sans", sans-serif; font-size: 20px; font-weight: 500; fill: #345; text-anchor: middle; }
      .title { font-family: "DejaVu Sans", sans-serif; font-size: 34px; font-weight: 700; fill: #004856; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <text x="60" y="58" class="title">Systemarchitektur Pflichtenheft</text>

  <rect x="95" y="130" width="260" height="90" class="box"/>
  <text x="225" y="166" class="label">Admin</text>
  <text x="225" y="194" class="small">Dashboard</text>

  <rect x="95" y="315" width="260" height="90" class="box"/>
  <text x="225" y="351" class="label">Partner</text>
  <text x="225" y="379" class="small">Dashboard</text>

  <rect x="95" y="500" width="260" height="90" class="box"/>
  <text x="225" y="536" class="label">Nutzer</text>
  <text x="225" y="564" class="small">Dashboard</text>

  <rect x="510" y="225" width="330" height="220" class="box"/>
  <text x="675" y="292" class="label">React Frontend</text>
  <text x="675" y="326" class="small">Landing, Auth, Dashboards</text>
  <text x="675" y="360" class="small">Survey-spezifisches Routing</text>
  <text x="675" y="394" class="small">API Client</text>

  <rect x="980" y="250" width="300" height="170" class="api"/>
  <text x="1130" y="312" class="label">FastAPI Backend</text>
  <text x="1130" y="346" class="small">Auth, Step Engine</text>
  <text x="1130" y="380" class="small">Admin, Partner, Uploads</text>

  <rect x="970" y="560" width="210" height="85" class="store"/>
  <text x="1075" y="596" class="label">MongoDB</text>
  <text x="1075" y="624" class="small">Datenbank</text>

  <rect x="680" y="560" width="230" height="85" class="store"/>
  <text x="795" y="596" class="label">Upload</text>
  <text x="795" y="624" class="small">Storage</text>

  <rect x="1240" y="560" width="130" height="85" class="store"/>
  <text x="1305" y="596" class="label">Mail</text>
  <text x="1305" y="624" class="small">Provider</text>

  <path d="M355,175 C420,175 445,260 510,285" class="line"/>
  <path d="M355,360 L510,360" class="line"/>
  <path d="M355,545 C420,545 445,435 510,400" class="line"/>
  <path d="M840,335 L980,335" class="line"/>
  <path d="M1075,420 L1075,560" class="line"/>
  <path d="M1040,420 C980,500 890,520 795,560" class="line"/>
  <path d="M1200,420 C1255,480 1290,515 1305,560" class="line"/>
</svg>
